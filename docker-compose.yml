

services:

  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: college_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - marketplace_net

  # ── Python ML Microservice ─────────────────────────────────────
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: college_ml
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - marketplace_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Node.js Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/college_marketplace
      - JWT_SECRET=college_marketplace_aiml_secret_2024
      - ML_SERVICE_URL=http://ml-service:5001
    depends_on:
      - mongo
      - ml-service
    networks:
      - marketplace_net

  # ── Frontend (Nginx static server) ────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: college_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - marketplace_net

volumes:
  mongo_data:

networks:
  marketplace_net:
    driver: bridge
