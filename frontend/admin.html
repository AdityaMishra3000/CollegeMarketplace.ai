<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - College Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .admin-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .chart-container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .charts-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-wrapper { grid-template-columns: 1fr; } }
        
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 40px; }
        .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .data-table th { background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-weight: 600; }
        .data-table tr:hover { background-color: #f8fafc; }
        .danger-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .danger-btn:hover { background: #dc2626; }
    </style>
</head>
<body style="background: #f8fafc;">

    <div class="admin-container" id="adminApp" style="display: none;">
        <div class="admin-header">
            <h1>🛡️ Admin Control Center</h1>
            <div>
                <button class="btn btn-secondary" onclick="window.location.href='index.html'" style="margin-right: 10px;">🏠 Back to App</button>
                <button class="btn" style="background: #ef4444; color: white;" onclick="logoutAdmin()">Logout</button>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="stat-item">
                <div class="stat-number" id="kpiUsers">0</div>
                <div class="stat-label">Total Verified Students</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="kpiProducts">0</div>
                <div class="stat-label">Active Listings</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="kpiValue">₹0</div>
                <div class="stat-label">Total Market Value</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="kpiAvg">₹0</div>
                <div class="stat-label">Avg. Item Price</div>
            </div>
        </div>

        <div class="charts-wrapper">
            <div class="chart-container">
                <h3 style="margin-bottom: 15px; color: #333;">Students by Course</h3>
                <canvas id="usersChart"></canvas>
            </div>
            <div class="chart-container">
                <h3 style="margin-bottom: 15px; color: #333;">Listings by Category</h3>
                <canvas id="productsChart"></canvas>
            </div>
        </div>

        <h2 style="margin-bottom: 15px; color: #333;">👤 Student Accounts</h2>
        <div style="overflow-x: auto;">
            <table class="data-table" id="usersTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email (.edu.in)</th>
                        <th>Course</th>
                        <th>Role</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <h2 style="margin-bottom: 15px; color: #333;">📦 Market Listings</h2>
        <div style="overflow-x: auto;">
            <table class="data-table" id="productsTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Seller</th>
                        <th>Status/Qty</th> <th>Risk Score</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <div id="loadingScreen" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="loading-spinner"></div>
    </div>

    <script src="apiService.js"></script>
    <script src="authAPI.js"></script>
    <script src="admin.js"></script>
</body>
</html>
